<circle cx="539.56" cy="326.97" r="1.3" fill="#cfd8ff" opacity="0.35"/><circle cx="1167.41" cy="62.80" r="0.8" fill="#cfd8ff" opacity="0.83"/><circle cx="444.05" cy="44.53" r="1.0" fill="#cfd8ff" opacity="0.59"/><circle cx="58.99" cy="61.90" r="1.0" fill="#cfd8ff" opacity="0.82"/><circle cx="293.19" cy="189.71" r="1.3" fill="#cfd8ff" opacity="0.85"/><text x="40" y="52" font-size="26" font-weight="700">From a date to pixels</text><rect x="44" y="100" width="184" height="124" rx="14" fill="#0b1022" stroke="#6ea8ff" stroke-width="1.6"/><text x="60" y="132" font-size="17" font-weight="700" fill="#6ea8ff" style="fill:#6ea8ff">1  Date</text><text x="60" y="162" font-size="14">today + N days</text><text x="60" y="184" font-size="14">(the dial)</text><text x="46" y="250" font-size="11.5" class="m dim">src/state/time.ts</text><line x1="234" y1="162.0" x2="268" y2="162.0" stroke="#ffb347" stroke-width="2" marker-end="url(#a)"/><text x="251.0" y="152.0" font-size="12" class="m dim" text-anchor="middle">Date</text><rect x="276" y="100" width="184" height="124" rx="14" fill="#0b1022" stroke="#ffb347" stroke-width="1.6"/><text x="292" y="132" font-size="17" font-weight="700" fill="#ffb347" style="fill:#ffb347">2  Ephemeris</text><text x="292" y="162" font-size="14">astronomy-engine:</text><text x="292" y="184" font-size="14">EclipticLongitude()</text><text x="292" y="206" font-size="14">HelioDistance()</text><text x="278" y="250" font-size="11.5" class="m dim">src/ephemeris/planets.ts</text><line x1="466" y1="162.0" x2="500" y2="162.0" stroke="#ffb347" stroke-width="2" marker-end="url(#a)"/><text x="483.0" y="152.0" font-size="12" class="m dim" text-anchor="middle">λ, r</text><rect x="508" y="100" width="184" height="124" rx="14" fill="#0b1022" stroke="#9fe0a6" stroke-width="1.6"/><text x="524" y="132" font-size="17" font-weight="700" fill="#9fe0a6" style="fill:#9fe0a6">3  Keep the angle</text><text x="524" y="162" font-size="14">λ for each planet</text><text x="524" y="184" font-size="14">r is dropped</text><text x="510" y="250" font-size="11.5" class="m dim">src/ephemeris/planets.ts</text><line x1="698" y1="162.0" x2="732" y2="162.0" stroke="#ffb347" stroke-width="2" marker-end="url(#a)"/><text x="715.0" y="152.0" font-size="12" class="m dim" text-anchor="middle">λ</text><rect x="740" y="100" width="184" height="124" rx="14" fill="#0b1022" stroke="#d9a0ff" stroke-width="1.6"/><text x="756" y="132" font-size="17" font-weight="700" fill="#d9a0ff" style="fill:#d9a0ff">4  Even rings</text><text x="756" y="162" font-size="14">ring k = 0 … 7</text><text x="756" y="184" font-size="14">radius = 8 + 4.6 k</text><text x="742" y="250" font-size="11.5" class="m dim">src/scene/layout.ts</text><line x1="930" y1="162.0" x2="964" y2="162.0" stroke="#ffb347" stroke-width="2" marker-end="url(#a)"/><text x="947.0" y="152.0" font-size="12" class="m dim" text-anchor="middle">x, z</text><rect x="972" y="100" width="184" height="124" rx="14" fill="#0b1022" stroke="#ff8a7a" stroke-width="1.6"/><text x="988" y="132" font-size="17" font-weight="700" fill="#ff8a7a" style="fill:#ff8a7a">5  Render</text><text x="988" y="162" font-size="14">Three.js: tilt, spin,</text><text x="988" y="184" font-size="14">light, textures</text><text x="974" y="250" font-size="11.5" class="m dim">src/scene/SolarScene.ts</text><text x="40" y="304" font-size="14" class="dim">Positions are computed once per change of date; the 3D scene never goes through React state per frame.</text></svg>