4" fill="none"/><line x1="384.20" y1="212.20" x2="427.16" y2="113.12" stroke="#ffb347" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="402.50" y="262" font-size="18" font-weight="700" text-anchor="middle">Earth</text><text x="402.50" y="288" font-size="18" class="m amb" text-anchor="middle">23.44°</text><text x="402.50" y="312" font-size="12.5" class="dim" text-anchor="middle">gives us seasons</text><line x1="547.50" y1="100" x2="547.50" y2="240" stroke="#3a4468" stroke-dasharray="3 5"/><circle cx="547.50" cy="170" r="34" fill="#c1593a"/><circle cx="538.50" cy="161" r="34" fill="none"/><line x1="527.92" y1="211.63" x2="573.89" y2="113.90" stroke="#ffb347" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="547.50" y="262" font-size="18" font-weight="700" text-anchor="middle">Mars</text><text x="547.50" y="288" font-size="18" class="m amb" text-anchor="middle">25.19°</text><text x="547.50" y="312" font-size="12.5" class="dim" text-anchor="middle">seasons like Earth's</text><line x1="692.50" y1="100" x2="692.50" y2="240" stroke="#3a4468" stroke-dasharray="3 5"/><circle cx="692.50" cy="170" r="34" fill="#d9b38c"/><circle cx="683.50" cy="161" r="34" fill="none"/><line x1="689.99" y1="215.93" x2="695.89" y2="108.09" stroke="#ffb347" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="692.50" y="262" font-size="18" font-weight="700" text-anchor="middle">Jupiter</text><text x="692.50" y="288" font-size="18" class="m amb" text-anchor="middle">3.13°</text><text x="692.50" y="312" font-size="12.5" class="dim" text-anchor="middle">nearly upright</text><line x1="837.50" y1="100" x2="837.50" y2="240" stroke="#3a4468" stroke-dasharray="3 5"/><circle cx="837.50" cy="170" r="34" fill="#e6d3a1"/><circle cx="828.50" cy="161" r="34" fill="none"/><line x1="816.81" y1="211.08" x2="865.39" y2="114.63" stroke="#ffb347" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="837.50" y="262" font-size="18" font-weight="700" text-anchor="middle">Saturn</text><text x="837.50" y="288" font-size="18" class="m amb" text-anchor="middle">26.73°</text><text x="837.50" y="312" font-size="12.5" class="dim" text-anchor="middle">rings follow the tilt</text><line x1="982.50" y1="100" x2="982.50" y2="240" stroke="#3a4468" stroke-dasharray="3 5"/><circle cx="982.50" cy="170" r="34" fill="#9fe0e6"/><circle cx="973.50" cy="161" r="34" fill="none"/><line x1="936.92" y1="163.78" x2="1043.93" y2="178.38" stroke="#ffb347" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="982.50" y="262" font-size="18" font-weight="700" text-anchor="middle">Uranus</text><text x="982.50" y="288" font-size="18" class="m amb" text-anchor="middle">97.77°</text><text x="982.50" y="312" font-size="12.5" class="dim" text-anchor="middle">rolls on its side</text><line x1="1127.50" y1="100" x2="1127.50" y2="240" stroke="#3a4468" stroke-dasharray="3 5"/><circle cx="1127.50" cy="170" r="34" fill="#4a6cf0"/><circle cx="1118.50" cy="161" r="34" fill="none"/><line x1="1105.68" y1="210.49" x2="1156.91" y2="115.42" stroke="#ffb347" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="1127.50" y="262" font-size="18" font-weight="700" text-anchor="middle">Neptune</text><text x="1127.50" y="288" font-size="18" class="m amb" text-anchor="middle">28.32°</text><text x="1127.50" y="312" font-size="12.5" class="dim" text-anchor="middle">similar to Earth</text></svg>