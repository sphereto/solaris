.14" fill="none" stroke="#7584b8" stroke-opacity=".5"/><circle cx="900" cy="345" r="164.43" fill="none" stroke="#7584b8" stroke-opacity=".5"/><circle cx="900" cy="345" r="189.71" fill="none" stroke="#7584b8" stroke-opacity=".5"/><circle cx="900" cy="345" r="215.00" fill="none" stroke="#7584b8" stroke-opacity=".5"/><circle cx="900" cy="345" r="22" fill="url(#g)"/><circle cx="900" cy="345" r="8" fill="#ffb347"/><circle cx="914.32" cy="380.20" r="3" fill="#9a9a9a"/><text x="924.32" y="384.20" font-size="12.5" text-anchor="start" class="dim">Mercury</text><circle cx="962.76" cy="336.87" r="4.5" fill="#e3c27a"/><text x="972.76" y="340.87" font-size="12.5" text-anchor="start" class="dim">Venus</text><circle cx="985.05" cy="320.26" r="5" fill="#3b82d6"/><text x="995.05" y="324.26" font-size="12.5" text-anchor="start" class="dim">Earth</text><circle cx="900.20" cy="231.14" r="4" fill="#c1593a"/><text x="910.20" y="235.14" font-size="12.5" text-anchor="start" class="dim">Mars</text><circle cx="806.57" cy="241.89" r="8" fill="#d9b38c"/><text x="796.57" y="245.89" font-size="12.5" text-anchor="end" class="dim">Jupiter</text><circle cx="1061.14" cy="312.30" r="7" fill="#e6d3a1"/><text x="1071.14" y="316.30" font-size="12.5" text-anchor="start" class="dim">Saturn</text><circle cx="985.74" cy="175.77" r="6" fill="#9fe0e6"/><text x="995.74" y="179.77" font-size="12.5" text-anchor="start" class="dim">Uranus</text><circle cx="1114.69" cy="333.45" r="6" fill="#4a6cf0"/><text x="1124.69" y="337.45" font-size="12.5" text-anchor="start" class="dim">Neptune</text><line x1="303" y1="348" x2="230" y2="457" stroke="#ffb347" stroke-width="1.2"/><text x="125" y="477" font-size="14" class="amb" paint-order="stroke" stroke="#03040a" stroke-width="5" stroke-linejoin="round">Mercury, Venus, Earth and Mars</text><text x="125" y="495" font-size="14" class="amb" paint-order="stroke" stroke="#03040a" stroke-width="5" stroke-linejoin="round">all fit inside this speck</text><text x="600.0" y="588" font-size="15" text-anchor="middle">Neptune is 30.1 AU out and Mercury is 0.39 AU: a 78x range. A phone screen cannot show both honestly.</text><text x="600.0" y="612" font-size="13" class="dim" text-anchor="middle">Semi-major axes are rounded; planet sizes are not to scale in either picture.</text></svg>