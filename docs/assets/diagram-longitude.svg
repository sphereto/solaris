<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d"><title id="t">Heliocentric ecliptic longitude</title><desc id="d">Top-down diagram: the Sun at the center, a planet on its orbit, and the angle lambda measured counter-clockwise from the March-equinox direction.</desc><style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#d7def7}.m{font-family:'SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace}.dim{fill:#8a96bf}.amb{fill:#ffb347}</style><defs><radialGradient id="g"><stop offset="0" stop-color="#ffd9a0"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb347"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d7def7"/></marker></defs><rect width="1000" height="640" rx="18" fill="#03040a"/><circle cx="622.90" cy="474.74" r="1.3" fill="#cfd8ff" opacity="0.27"/><circle cx="465.62" cy="603.75" r="0.5" fill="#cfd8ff" opacity="0.84"/><circle cx="573.94" cy="8.39" r="0.6" fill="#cfd8ff" opacity="0.52"/><circle cx="71.93" cy="395.47" r="1.0" fill="#cfd8ff" opacity="0.33"/><circle cx="1.77" cy="557.70" r="0.6" fill="#cfd8ff" opacity="0.75"/><circle cx="960.13" cy="106.15" r="0.6" fill="#cfd8ff" opacity="0.44"/><circle cx="961.48" cy="345.10" r="0.6" fill="#cfd8ff" opacity="0.37"/><circle cx="968.56" cy="126.00" r="1.0" fill="#cfd8ff" opacity="0.44"/><circle cx="361.19" cy="106.21" r="0.6" fill="#cfd8ff" opacity="0.42"/><circle cx="586.14" cy="381.43" r="0.8" fill="#cfd8ff" opacity="0.29"/><circle cx="696.42" cy="118.25" r="1.0" fill="#cfd8ff" opacity="0.71"/><circle cx="57.00" cy="624.06" r="0.5" fill="#cfd8ff" opacity="0.87"/><circle cx="623.71" cy="610.81" r="0.5" fill="#cfd8ff" opacity="0.74"/><ci