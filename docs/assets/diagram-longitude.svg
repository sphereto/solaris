0.00" y="120.00" font-size="17" class="m dim" text-anchor="middle">90°</text><text x="88.00" y="365.00" font-size="17" class="m dim" text-anchor="end">180°</text><text x="330.00" y="612.00" font-size="17" class="m dim" text-anchor="middle">270°</text><line x1="330" y1="360" x2="558.00" y2="360.00" stroke="#ffb347" stroke-width="2.5" marker-end="url(#a)"/><text x="550.00" y="398.00" font-size="14" class="amb" text-anchor="end">zero direction:</text><text x="550.00" y="416.00" font-size="14" class="amb" text-anchor="end">March equinox point</text><path d="M408.00 360.00 A78 78 0 0 0 378.02 298.54" fill="none" stroke="#ffb347" stroke-width="2.5" marker-end="url(#a)"/><text x="428.89" y="312.42" font-size="22" font-style="italic" class="amb">λ</text><line x1="330" y1="360" x2="453.13" y2="202.40" stroke="#d7def7" stroke-width="1.5" stroke-dasharray="2 5"/><text x="398.34" y="250.29" font-size="22" font-style="italic" text-anchor="end">r</text><circle cx="453.13" cy="202.40" r="13" fill="#6ea8ff" opacity=".28"/><circle cx="453.13" cy="202.40" r="8" fill="#6ea8ff"/><text x="469.13" y="190.40" font-size="15">planet</text><circle cx="330" cy="360" r="40" fill="url(#g)"/><circle cx="330" cy="360" r="13" fill="#ffb347"/><text x="330" y="394" font-size="14" text-anchor="middle" class="dim">Sun</text><path d="M156.79 260.00 A200 200 0 0 0 134.37 318.42" fill="none" stroke="#d7def7" stroke-width="2.5" marker-end="url(#w)"/><text x="185.47" y="193.48" font-size="14" text-anchor="end">planets orbit</text><text x="185.47" y="211.48" font-size="14" text-anchor="end">counter-clockwise</text><rect x="650" y="110" width="310" height="470" rx="14" fill="#0b1022" stroke="#3a4468"/><text x="672" y="148" font-size="17" font-weight="700" fill="#ffb347" style="fill:#ffb347">λ  longitude</text><text x="672" y="171" font-size="15">The angle around the Sun,</text><text x="672" y="194" font-size="15">counter-clockwise from the</text><text x="672" y="217" font-size="15">March equinox direction,</text><text x="672" y="240" font-size="15">along the ecliptic plane.</text><text x="672" y="282" font-size="17" font-weight="700" fill="#d7def7" style="fill:#d7def7">r  distance</text><text x="672" y="305" font-size="15">How far from the Sun, in</text><text x="672" y="328" font-size="15">astronomical units (AU).</text><text x="672" y="370" font-size="17" font-weight="700" fill="#9db7ff" style="fill:#9db7ff">What Solaris does</text><text x="672" y="393" font-size="15">Uses λ exactly, for every</text><text x="672" y="416" font-size="15">planet, on any date.</text><text x="672" y="439" font-size="15">Ignores r: rings are evenly</text><text x="672" y="462" font-size="15">spaced so all 8 fit on screen.</text><text x="672" y="504" font-size="17" font-weight="700" fill="#9fe0a6" style="fill:#9fe0a6">Handy fact</text><text x="672" y="527" font-size="15">Earth's λ = the Sun's</text><text x="672" y="550" font-size="15">geocentric longitude + 180°.</text></svg>